name: "AI README Maintainer"
description: "Automatically analyzes your repository and updates the README using Google Gemini AI."

author: "Jenil Savaj"

branding:
  icon: book-open
  color: blue

inputs:
  github-token:
    description: GitHub token used to create branches and pull requests.
    required: true

  gemini-api-key:
    description: Google Gemini API key.
    required: true

  model:
    description: Gemini model to use.
    required: false
    default: "gemini-2.5-flash"

  branch-prefix:
    description: Prefix for the generated branch.
    required: false
    default: "readme-ai"

  commit-message:
    description: Commit message for README updates.
    required: false
    default: "docs: update README"

  pr-title:
    description: Pull request title.
    required: false
    default: "docs: update README"

  base-branch:
    description: Base branch for the pull request.
    required: false
    default: "main"

  dry-run:
    description: Analyze repository without creating commits or pull requests.
    required: false
    default: "false"

  compare-ref:
    description: Explicit Git compare reference. Overrides automatic detection.
    required: false

runs:
  using: node24
  main: dist/index.js